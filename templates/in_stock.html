<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>货物入库</title>
    <style>
        /* 响应式适配 */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 40px;
            }
            .module-title {
                font-size: 1.1rem;
            }
            .btn {
                min-width: 140px;
                padding: 14px 20px;
                font-size: 0.9rem;
            }
            .btn-wrapper {
                gap: 30px;
            }
            /* ========== 产品管理弹窗整体适配 ========== */
            /* 弹窗容器：宽度自适应手机屏幕，取消最小宽度限制 */
            .modal.type-manage-modal .modal-content.type-manage-content {
                min-width: unset !important; /* 取消600px最小宽度 */
                max-width: 90% !important;   /* 最多占屏幕90%宽度 */
                width: 100% !important;
                padding: 15px !important;    /* 减小内边距，节省空间 */
            }

            /* 标签页适配：减小按钮padding，适配手机 */
            .tab-header {
                flex-wrap: wrap; /* 标签过多时自动换行 */
                gap: 5px;        /* 减小标签间距 */
            }
            .tab-item {
                padding: 6px 12px !important; /* 减小标签内边距 */
                font-size: 14px !important;
            }

            /* 表单行适配：手机端改为块级布局，避免横向挤压 */
            .crud-form .form-row {
                display: block !important; /* 取消flex，改为块级 */
                margin: 15px 0 !important;
            }
            .crud-form .form-row label {
                width: 100% !important;    /* 标签占满宽度 */
                text-align: left !important;/* 左对齐，节省空间 */
                margin-right: 0 !important;
                margin-bottom: 5px !important;
            }
            .crud-form .form-row input {
                width: 100% !important;    /* 输入框占满宽度 */
                max-width: unset !important;/* 取消300px最大宽度限制 */
                box-sizing: border-box !important;
            }

            /* 表单按钮组：取消左对齐，适配块级布局 */
            .crud-form .btn-group {
                margin-left: 0 !important;  /* 取消90px左间距 */
                margin-top: 10px !important;
            }
            .btn-primary, .btn-reset {
                padding: 5px 10px !important; /* 减小按钮大小 */
                font-size: 14px !important;
            }

            /* 表格容器：强化横向滚动，适配手机 */
            .table-container {
                margin-top: 10px !important;
                max-width: 100% !important;
                overflow-x: auto !important; /* 强制横向滚动 */
            }
            .data-table {
                font-size: 13px !important; /* 减小表格字体 */
            }
            .data-table th, .data-table td {
                padding: 6px 8px !important; /* 减小表格单元格内边距 */
            }
            .oper-btn {
                padding: 2px 5px !important; /* 减小操作按钮大小 */
                font-size: 12px !important;
            }

            /* ========== 入库表单的下拉框+管理按钮适配 ========== */
            /* 手机端管理按钮换行显示，避免和下拉框重叠 */
            .form-item {
                display: flex !important;
                flex-direction: column !important;
                align-items: flex-start !important;
            }
            .form-item.select-item {
                flex-direction: row !important;
                align-items: center !important;
                flex-wrap: wrap !important;
            }
            .quantity-group {
                flex-direction: row !important;
                align-items: center !important;
            }
            .form-item select {
                width: 100% !important; /* 下拉框占满宽度 */
                margin-bottom: 10px !important; /* 和按钮隔开 */
            }
            .manage-btn {
                margin-left: 0 !important; /* 取消左间距 */
                padding: 6px 10px !important; /* 减小按钮大小 */
                font-size: 14px !important;
                margin-top: 10px !important;
            }

            /* 弹窗关闭按钮：适配手机点击 */
            .modal.type-manage-modal .modal-close {
                padding: 8px 15px !important;
                font-size: 14px !important;
                width: 80% !important; /* 按钮占80%宽度，方便点击 */
            }
            /* 数量组手机端适配 */
            .quantity-group .form-input {
                width: 100% !important;
                max-width: 120px !important;
            }
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .form-container {
            display: inline-block;
            text-align: left;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .form-item {
            margin: 15px 0;
            display: flex;
            align-items: center;
        }
        /* 下拉框项特殊样式 */
        .form-item.select-item {
            align-items: center;
        }
        /* 数量组：箱数+每箱数量一排 */
        .quantity-group {
            display: flex;
            align-items: center;
            gap: 20px; /* 两个输入框之间的间距 */
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        select, input {
            padding: 8px;
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .time-input-group {
            position: relative;
            display: inline-block;
            width: 220px;
        }
        .time-input {
            padding-right: 30px;
            width: 100%;
            box-sizing: border-box;
        }
        .calendar-icon {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            cursor: pointer;
            font-size: 16px;
            z-index: 2;
        }
        .submit-btn {
            margin-top: 20px;
            padding: 10px 30px;
            background-color: #4285F4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        .submit-btn:hover {
            background-color: #3367D6;
        }
        .back-btn {
            display: block;
            margin-top: 20px;
            color: #4285F4;
            text-decoration: none;
        }

        /* ========== 新增：修复laydate按钮重叠样式 ========== */
        .laydate-footer {
            display: flex !important;
            gap: 5px !important; /* 按钮之间加间距 */
            padding: 5px !important;
            box-sizing: border-box !important;
        }
        .laydate-footer span {
            display: inline-block !important;
            padding: 2px 8px !important;
            margin: 0 !important;
            border: 1px solid #ccc !important;
            border-radius: 3px !important;
            cursor: pointer !important;
            white-space: nowrap !important; /* 防止文字换行 */
        }
        .laydate-main {
            width: auto !important; /* 自适应宽度，避免挤压 */
        }

        /* ========== 仅新增：弹窗样式（不影响原有逻辑） ========== */
        .modal {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999 !important;
            /* 关键：脱离所有父级层级影响，确保层级最高 */
            transform: translateZ(0) !important;
            z-index: 999999 !important; /* 重复声明，防止被覆盖 */
            display: none;
        }
        .modal-content {
            background: white;
            padding: 20px 30px;
            border-radius: 8px;
            min-width: 300px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
        .modal-success {
            border-left: 5px solid #2e7d32;
        }
        .modal-error {
            border-left: 5px solid #c62828;
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .modal-success .modal-title {
            color: #2e7d32;
        }
        .modal-error .modal-title {
            color: #c62828;
        }
        .modal-close {
            margin-top: 15px;
            padding: 6px 15px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* 降低type-manage-content弹窗的层级，让提示弹窗能覆盖它 */
        .type-manage-modal .modal-content.type-manage-content {
            position: relative !important; /* 确保z-index生效 */
            z-index: 1000 !important; /* 设为极低值，远低于提示弹窗的999999 */
            min-width: 600px; /* 加宽产品类型管理弹窗 */
        }
        /* 同时降低外层type-manage-modal遮罩的层级（兜底） */
        .modal.type-manage-modal {
            position: fixed !important;
            z-index: 999 !important; /* 比提示弹窗低100倍 */
        }

        /* ========== 新增：产品类型管理弹窗的标签页样式（核心切换样式） ========== */
        .tab-header {
            display: flex;
            border-bottom: 1px solid #ccc;
            margin-bottom: 15px;
        }
        .tab-item {
            padding: 8px 20px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            margin-bottom: -1px;
            border-radius: 5px 5px 0 0;
            background: #f5f5f5;
        }
        .tab-item.active {
            background: white;
            border-color: #ccc;
            font-weight: bold;
            color: #4285F4;
        }
        .tab-content {
            display: none; /* 默认隐藏所有标签内容 */
        }
        .tab-content.active {
            display: block; /* 激活的标签内容显示 */
        }

        /* ========== 新增：产品类型管理弹窗的表单和按钮样式 ========== */
        .manage-btn {
            padding: 8px 12px;
            margin-left: 10px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .crud-form {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #eee;
            border-radius: 5px;
        }
        .form-row {
            margin: 10px 0;
            display: flex;
            align-items: center;
        }
        .form-row label {
            width: 80px;
            text-align: right;
            margin-right: 10px;
        }
        .form-row input {
            flex: 1;
            max-width: 300px;
        }
        .btn-group {
            margin-left: 90px; /* 对齐标签宽度 */
        }
        .btn-primary {
            padding: 6px 15px;
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-reset {
            padding: 6px 15px;
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        .table-container {
            max-height: 300px;
            overflow-y: auto;
            width: 100%;
            overflow-x: auto;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }
        .data-table th, .data-table td {
            padding: 8px 12px;
            border: 1px solid #ccc;
        }
        .data-table th {
            background: #f5f5f5;
        }
        .oper-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin: 0 2px;
        }
        .edit-btn {
            background: #4CAF50;
            color: white;
        }
        .delete-btn {
            background: #f44336;
            color: white;
        }
        .form-input {
            margin: 0 5px;
            padding: 8px;
            width: 100%;
            max-width: 150px;
            box-sizing: border-box;
        }
    </style>

</head>
<body>
    <h1>货物入库</h1>

    <!-- ========== 仅新增：弹窗容器 ========== -->
    <div class="modal" id="tipModal">
        <div class="modal-content" id="modalContent">
            <div class="modal-title" id="modalTitle"></div>
            <div id="modalMsg"></div>
            <button class="modal-close" onclick="closeModal()">确定</button>
        </div>
    </div>

    <!-- 新增：产品类型管理弹窗 -->
    <div class="modal type-manage-modal" id="typeManageModal">
        <div class="modal-content type-manage-content">
            <h3 style="text-align: center; margin-top: 0;">产品类型管理</h3>
            <!-- 标签页头部 -->
            <div class="tab-header">
                <div class="tab-item active" data-tab="model">产品型号</div>
                <div class="tab-item" data-tab="material">材质</div>
            </div>
            <!-- 产品型号标签内容 -->
            <div class="tab-content active" id="modelTab">
                <div class="crud-form">
                    <div class="form-row">
                        <label>型号名称：</label>
                        <input type="text" id="modelNameInput" placeholder="请输入产品型号名称">
                        <input type="hidden" id="modelIdInput"> <!-- 存储编辑的ID -->
                    </div>
                    <div class="form-row btn-group">
                        <button class="btn-primary" onclick="submitModel()">新增</button>
                        <button class="btn-reset" onclick="resetModelForm()">重置</button>
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table" id="modelTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>型号名称</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态渲染型号列表 -->
                        </tbody>
                    </table>
                </div>
            </div>
            <!-- 材质标签内容 -->
            <div class="tab-content" id="materialTab">
                <div class="crud-form">
                    <div class="form-row">
                        <label>材质名称：</label>
                        <input type="text" id="materialNameInput" placeholder="请输入材质名称">
                        <input type="hidden" id="materialIdInput"> <!-- 存储编辑的ID -->
                    </div>
                    <div class="form-row btn-group">
                        <button class="btn-primary" onclick="submitMaterial()">新增</button>
                        <button class="btn-reset" onclick="resetMaterialForm()">重置</button>
                    </div>
                </div>
                <div class="table-container">
                    <table class="data-table" id="materialTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>材质名称</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 动态渲染材质列表 -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <button class="modal-close" onclick="closeTypeManageModal()">关闭</button>
            </div>
        </div>
    </div>

    <div class="form-container">
        <form method="POST">
            <div class="form-item select-item">
                <label for="product_model">产品型号：</label>
                <input type="text" id="modelSearch" placeholder="输入型号搜索..." style="margin-bottom:8px; width:220px;">
                <select name="product_model" id="product_model" required>
                    <option value="">请选择型号</option>
                    <option value="型号A">型号A</option>
                    <option value="型号B">型号B</option>
                    <option value="型号C">型号C</option>
                    <option value="型号D">型号D</option>
                </select>
                <!-- 新增：产品类型管理按钮 -->
                <button type="button" class="manage-btn" onclick="openTypeManageModal()">管理产品类型</button>
            </div>
            <div class="form-item select-item">
                <label for="material">材质：</label>
                <select name="material" id="material" required>
                    <option value="">请选择材质</option>
                    <option value="材质1">材质1</option>
                    <option value="材质2">材质2</option>
                    <option value="材质3">材质3</option>
                    <option value="材质4">材质4</option>
                    <option value="材质5">材质5</option>
                </select>
            </div>
            {# <!-- 修复：箱数+每箱数量一排 -->
            <div class="form-item">
                <label>数量信息：</label>
                <div class="quantity-group">
                    <div>
                        <label style="width: auto; font-weight: normal;">每箱数量：</label>
                        <input type="number" name="per_box_num" id="per_box_num" placeholder="每箱数量" 
                            class="form-input" min="0" oninput="calcTotalNum()">
                    </div>
                    <div>
                        <label style="width: auto; font-weight: normal;">箱数：</label>
                        <input type="number" name="box_num" id="box_num" placeholder="箱数" 
                            class="form-input" min="0" oninput="calcTotalNum()">
                    </div>
                </div>
            </div>
            <!-- 总数量单独一排 -->
            <div class="form-item">
                <label for="in_quantity">入库总数：</label>
                <input type="number" name="in_quantity" id="in_quantity" placeholder="请输入入库总数" required
                       class="form-input" min="1" oninput="clearBoxNums()">
            </div> #}
            <div class="form-item">
                <label>每箱数量：</label>
                <!-- 新增：每箱数量 -->
                <input type="number" name="per_box_num" id="per_box_num" placeholder="每箱数量（可为空）" 
                    class="form-input" oninput="calcTotalNum()">
            </div>
            <div class="form-item">
                <label for="box_num">箱数：</label>
                <input type="number" name="box_num" id="box_num" placeholder="箱数（可为空）" 
                    class="form-input" oninput="calcTotalNum()">
            </div>
            <div class="form-item">
                <label for="in_quantity">入库总数：</label>
                <input type="number" name="in_quantity" id="in_quantity" placeholder="请输入入库总数" required
                       class="form-input" onchange="clearBoxNums()">
            </div>
            <div class="form-item">
                <label for="in_time">入库时间：</label>
                <div class="time-input-group">
                    <input type="text" name="in_time" id="in_time" class="time-input"
                           placeholder="选择年月日时分秒" readonly>
                    <span class="calendar-icon" id="calendarIcon">📅</span>
                </div>
            </div>
            <div class="form-item">
                <label for="remarks">备注信息：</label>
                <input type="text" name="remarks" id="remarks" placeholder="请输入备注（可选）">
            </div>
            <div class="form-item" style="text-align: center;">
                <button type="submit" class="submit-btn">确认入库</button>
            </div>
        </form>
    </div>
    <a href="/" class="back-btn">← 返回首页</a>

    <script>
        window.addEventListener('DOMContentLoaded', function() {

            const timeInput = document.getElementById('in_time');
            const calendarIcon = document.getElementById('calendarIcon');

            refreshSelectOptions(); // 页面加载时刷新下拉框选项

            if (!timeInput || !calendarIcon) {
                alert('时间输入框元素未找到！');
                return;
            }
            if (typeof laydate === 'undefined') {
                alert('laydate加载失败，请检查路径：/static/laydate/laydate.js！');
                return;
            }

            const now = new Date();
            const formattedTime = now.getFullYear() + '-' + 
                                 String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                                 String(now.getDate()).padStart(2, '0') + ' ' + 
                                 String(now.getHours()).padStart(2, '0') + ':' + 
                                 String(now.getMinutes()).padStart(2, '0') + ':' + 
                                 String(now.getSeconds()).padStart(2, '0');
            timeInput.value = formattedTime;

            laydate.render({
                elem: '#in_time',
                type: 'datetime',
                btns: ['confirm', 'now'],
                done: function(value) {
                    timeInput.value = value;
                }
            });

            calendarIcon.onclick = function() {
                timeInput.click();
            };
            timeInput.onclick = function() {};

            // ========== 仅新增：弹窗渲染逻辑（读取flash提示） ==========
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                    showModal('{{ category }}', '{{ message }}');
                {% endfor %}
              {% endif %}
            {% endwith %}

            // 初始化手动编辑标记
            document.getElementById('in_quantity').dataset.manualEdit = 'false';
        });
        

        // ========== 仅新增：弹窗显示/关闭函数 ==========
        function showModal(type, msg) {
            const modal = document.getElementById('tipModal');
            const modalContent = document.getElementById('modalContent');
            const modalTitle = document.getElementById('modalTitle');
            const modalMsg = document.getElementById('modalMsg');

            modalContent.className = 'modal-content';
            if (type === 'success') {
                modalContent.classList.add('modal-success');
                modalTitle.textContent = '操作成功';
            } else {
                modalContent.classList.add('modal-error');
                modalTitle.textContent = '操作失败';
            }
            modalMsg.textContent = msg;
            modal.style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('tipModal').style.display = 'none';
        }

        // ========== 新增：产品类型管理相关函数 ==========
        // 打开管理弹窗
        function openTypeManageModal() {
            document.getElementById('typeManageModal').style.display = 'flex';
            // 加载型号和材质数据
            loadModels();
            loadMaterials();
        }
        // 关闭管理弹窗
        function closeTypeManageModal() {
            document.getElementById('typeManageModal').style.display = 'none';
            // 重置表单
            resetModelForm();
            resetMaterialForm();
            // 刷新入库页面的下拉框
            refreshSelectOptions();
        }
        // 切换标签页
        document.querySelectorAll('.tab-item').forEach(item => {
            item.addEventListener('click', function() {
                // 移除所有active
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                // 激活当前标签
                this.classList.add('active');
                const tabId = this.dataset.tab + 'Tab';
                document.getElementById(tabId).classList.add('active');
            });
        });

        // ========== 产品型号CRUD ==========
        // 加载型号列表
        function loadModels() {
            fetch('/api/models')
                .then(response => response.json())
                .then(data => {
                    if (data.code === 200) {
                        const tableBody = document.querySelector('#modelTable tbody');
                        tableBody.innerHTML = '';
                        data.data.forEach(model => {
                            const tr = document.createElement('tr');
                            tr.innerHTML = `
                                <td>${model.id}</td>
                                <td>${model.name}</td>
                                <td>
                                    <button class="oper-btn edit-btn" onclick="editModel(${model.id}, '${model.name}')">编辑</button>
                                    <button class="oper-btn delete-btn" onclick="deleteModel(${model.id})">删除</button>
                                </td>
                            `;
                            tableBody.appendChild(tr);
                        });
                    } else {
                        showModal('error', '加载型号列表失败：' + data.msg);
                    }
                })
                .catch(error => {
                    showModal('error', '加载型号列表失败：' + error.message);
                });
        }
        // 重置型号表单
        function resetModelForm() {
            document.getElementById('modelIdInput').value = '';
            document.getElementById('modelNameInput').value = '';
            // 重置按钮文字为新增
            document.querySelector('#modelTab .btn-primary').textContent = '新增';
        }
        // 编辑型号（回显）
        function editModel(id, name) {
            document.getElementById('modelIdInput').value = id;
            document.getElementById('modelNameInput').value = name;
            // 修改按钮文字为编辑
            document.querySelector('#modelTab .btn-primary').textContent = '编辑';
        }
        // 提交型号（新增/编辑）
        function submitModel() {
            const id = document.getElementById('modelIdInput').value;
            const name = document.getElementById('modelNameInput').value.trim();
            if (!name) {
                showModal('error', '型号名称不能为空');
                return;
            }
            // 构建请求参数
            const url = id ? '/api/models/edit' : '/api/models/add';
            const data = id ? { id: id, name: name } : { name: name };
            
            fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
                .then(response => response.json())
                .then(res => {
                    if (res.code === 200) {
                        {# showModal('success', res.msg); #}
                        resetModelForm();
                        loadModels();
                    } else {
                        showModal('error', res.msg);
                    }
                })
                .catch(error => {
                    showModal('error', '操作失败：' + error.message);
                });
        }
        // 删除型号
        function deleteModel(id) {
            if (!confirm('确定删除该型号吗？删除后不可恢复！')) {
                return;
            }
            fetch(`/api/models/delete/${id}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
                .then(response => response.json())
                .then(res => {
                    if (res.code === 200) {
                        showModal('success', res.msg);
                        loadModels();
                    } else {
                        showModal('error', res.msg);
                    }
                })
                .catch(error => {
                    showModal('error', '删除失败：' + error.message);
                });
        }

        // ========== 刷新入库页面的下拉框选项 ==========

        // ========== 修复：自动计算相关函数 ==========
        function calcTotalNum() {
            // 严格转换为数值类型，避免字符串相乘问题
            const perBox = Number(document.getElementById('per_box_num').value) || 0;
            const box = Number(document.getElementById('box_num').value) || 0;
            const totalInput = document.getElementById('in_quantity');
            
            // 只有未手动编辑总数量时，才自动计算
            if (totalInput.dataset.manualEdit === 'false') {
                // 只有两个值都大于0时才计算，避免显示0
                totalInput.value = (perBox > 0 && box > 0) ? (perBox * box) : '';
            }
        }

        // 手动编辑总数量：清空前两个输入框，并标记为手动编辑
        function clearBoxNums() {
            const totalInput = document.getElementById('in_quantity');
            if (totalInput.value) {
                totalInput.dataset.manualEdit = 'true';
                document.getElementById('per_box_num').value = '';
                document.getElementById('box_num').value = '';
            } else {
                // 清空总数量时，重置手动编辑标记
                totalInput.dataset.manualEdit = 'false';
            }
        }
    
    // 监听型号搜索输入
    document.getElementById('modelSearch').addEventListener('input', function(e) {
        const keyword = e.target.value.trim().toLowerCase();
        const options = document.querySelectorAll('#product_model option');
        options.forEach(option => {
            // 排除默认的"请选择型号"选项
            if (option.value === '') {
                option.style.display = 'block';
                return;
            }
            // 匹配关键词（不区分大小写）
            const text = option.textContent.toLowerCase();
            option.style.display = text.includes(keyword) ? 'block' : 'none';
        });
    });
